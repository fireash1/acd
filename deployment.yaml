apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-deployment
  namespace: student-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student
  template:
    metadata:
      labels:
        app: student
    spec:
      containers:
        - name: student
          image: student-microservice:latest
          ports:
            - containerPort: 8080
